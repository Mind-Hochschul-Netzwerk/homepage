services:
  web:
    build:
      context: .
      dockerfile: mhnsite/Dockerfile
    volumes:
      # Persist the SQLite database outside the container
      - ./data:/app/data
    environment:
      # Ensure Django uses the persisted DB path
      - DJANGO_DB_PATH=/app/data/db.sqlite3
      - DJANGO_ALLOWED_HOSTS=wagtail.${DOMAINNAME}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=0
    networks:
      - traefik
      - ldap
    labels:
      - traefik.enable=true
      - traefik.http.routers.wagtail.rule=Host(`wagtail.${DOMAINNAME}`)
      - traefik.http.routers.wagtail.entrypoints=websecure
      - traefik.http.routers.wagtail.tls=true
      - traefik.http.routers.wagtail.middlewares=authelia@docker,secheader@file
      - traefik.http.services.wagtail.loadbalancer.server.port=8000
    restart: unless-stopped

networks:
  traefik:
    name: traefik
    external: true
  ldap:
    name: ldap
    external: true
