{% load wagtailcore_tags navigation_tags %}
{% load static %}
<header>
    {% get_site_root as site_root %}
    <nav class="lg:text-2xl 
        xl:px-30 lg:px-12 md:px-6 sm:px-5
        lg:py-5 md:py-4 sm:py-3 py-2
        lg:mb-3 md:mb-2 sm:mb-1 mb-1
        border-b-1 border-hellblau">
        <a href="{% pageurl site_root %}">
            <img src="{% static 'img/Logo.svg' %}" alt="Logo" class="inline w-60 h-20" />
        </a>
        {% for menuitem in site_root.get_children.live.in_menu %}
        <a href="{% pageurl menuitem %}">{{ menuitem.title }}</a>
        {% endfor %}
        <a href="/admin" class="float-right">
            <img src="{% static 'img/Login.svg' %}" alt="Logo" class="w-16 h-16" />
        </a>
    </nav>
</header>
