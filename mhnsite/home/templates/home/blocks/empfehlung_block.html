<div>
    {% if value.image and value.image.file %}
    <img src="{{ value.image.file.url }}" alt="{{ value.name|default:value.image.title }}" class="w-[250px] h-[250px] rounded-full object-cover object-center" loading="lazy">
    {% endif %}
</div>
<div>
    <p class="text-gray-600 mt-2">{{ value.text }}</p>
</div>
